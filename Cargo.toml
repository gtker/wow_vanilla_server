[package]
name = "wow_vanilla_server"
version = "0.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = {version = "1.38.2", features = ["full"]}
wow_login_messages = { git = "https://github.com/gtker/wow_messages.git", rev = "fa60daf84efcca13dafe544446f7d8dd70a77fd2", features = ["tokio"] }
wow_world_messages = { git = "https://github.com/gtker/wow_messages.git", rev = "fa60daf84efcca13dafe544446f7d8dd70a77fd2", features = ["tokio", "vanilla", "print-testcase"] }
wow_world_base = { git = "https://github.com/gtker/wow_messages.git", rev = "fa60daf84efcca13dafe544446f7d8dd70a77fd2", features = ["extended", "vanilla"] }
wow_items = { git = "https://github.com/gtker/wow_messages.git", rev = "fa60daf84efcca13dafe544446f7d8dd70a77fd2", features = ["vanilla"] }

#wow_login_messages = { path = "../wow_messages/wow_login_messages", features = ["tokio"] }
#wow_world_messages = { path = "../wow_messages/wow_world_messages", features = ["tokio", "vanilla", "print-testcase"] }
#wow_world_base = { path = "../wow_messages/wow_world_base", features = ["extended", "vanilla"] }
#wow_items = { path = "../wow_messages/wow_items", features = ["vanilla"] }

wow_srp = "0.7.0"
walkdir = "2.3.3"

namigator = { git = "https://github.com/gtker/namigator-rs.git", rev = "d73362c21cc2634129ad369b7dc0917b5c122d7c", features = ["vanilla"] }
#namigator = { path = "../namigator-rs/namigator", features = ["vanilla"] }
